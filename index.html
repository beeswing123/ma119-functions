<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA119 · Chapter 1 Functions — Guided Study</title>
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#14161b; --panel:#1b1e24; --panel2:#22252c; --line:#32363f;
  --txt:#e8eaef; --mut:#a0a8b4; --faint:#6f7683;
  --acc:#5f8af7; --acc-d:#3f66c9; --acc2:#8fb0ff;
  --good:#67c587; --bad:#e06c6c; --info:#6fb3d9;
  --zh:#90a0c0;
  --radius:12px;
}
html[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceef2; --line:#dde0e6;
  --txt:#22262e; --mut:#5a6270; --faint:#8b93a0;
  --acc:#2e6be6; --acc-d:#b9cdf3; --acc2:#2456b8;
  --good:#1f8a4d; --bad:#d24545; --info:#3b7ea8;
  --zh:#4a5c80;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a4150;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Toolbar ---------- */
header{
  height:50px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
.brand{font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand small{color:var(--mut);font-weight:500;margin-left:8px;font-size:12px}
nav{display:flex;gap:4px;margin-left:8px}
nav button{
  background:none;border:none;color:var(--mut);padding:6px 14px;border-radius:8px;
  font-size:14px;font-weight:600;
}
nav button:hover{color:var(--txt);background:#252932}
nav button.active{color:var(--acc2);background:#2a3140}
.spacer{flex:1}
.chip{font-size:12px;color:var(--mut);background:#252932;border:1px solid var(--line);
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.iconbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 10px;font-size:12.5px}
.iconbtn:hover{color:var(--txt);border-color:var(--acc-d)}

/* ---------- Layout ---------- */
main{height:calc(100vh - 50px);display:flex;overflow:hidden}
.rail{
  width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  padding:14px 10px;overflow-y:auto;
}
.rail h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);margin:6px 8px 8px}
.secitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:var(--mut);padding:9px 10px;border-radius:9px;font-size:13.5px;line-height:1.3;
}
.secitem:hover{background:#262b34;color:var(--txt)}
.secitem.active{background:#2a3140;color:var(--txt)}
.secitem.done .dot{background:var(--good);border-color:var(--good)}
.secitem .dot{width:9px;height:9px;border-radius:50%;border:2px solid #4a5261;flex-shrink:0}
.secitem.active .dot{border-color:var(--acc)}
.secitem .tag{margin-left:auto;font-size:11px;color:var(--faint)}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ---------- Conversation ---------- */
.conv{flex:1;overflow-y:auto;padding:22px 20px 8px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:11px}
.msg:last-child{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#3f66c9,#2c4a94);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#eaf0ff;
}
.bubble{
  background:var(--panel2);border:1px solid var(--line);border-radius:4px 13px 13px 13px;
  padding:11px 15px;max-width:640px;
}
.bubble p{margin:0 0 7px}
.bubble p:last-child{margin-bottom:0}
.bubble .who{font-size:12px;color:var(--acc2);font-weight:700;margin-bottom:3px}
.zh{color:var(--zh);font-size:.86em}
.muted{color:var(--mut)}
.mn{border-left:3px solid var(--acc);background:#2a3140;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:6px}
.mn b{color:var(--acc2)}
.math{font-family:"STIX Two Text",Georgia,"Times New Roman",serif;font-style:italic;font-size:1.06em}
.formula{
  background:#1a1d23;border:1px solid var(--line);border-radius:8px;padding:9px 14px;margin:6px 0;
  font-family:"STIX Two Text",Georgia,serif;font-size:17px;text-align:center;
}
.askcard{border-color:var(--acc-d);box-shadow:0 0 0 1px rgba(95,138,247,.15)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices button{
  text-align:left;background:#242830;border:1px solid var(--line);color:var(--txt);
  padding:9px 13px;border-radius:9px;font-size:14px;transition:.15s;
}
.choices button:hover{border-color:var(--acc-d);background:#2a3140}
.choices button:disabled{cursor:default;opacity:.85}
.choices button.correct{border-color:var(--good);background:#223026}
.choices button.wrong{border-color:var(--bad);background:#32242a}
.fb{margin-top:9px;padding:8px 12px;border-radius:8px;font-size:13.5px;display:none}
.fb.show{display:block}
.fb.ok{background:#223026;color:#a8dcbb;border:1px solid #3f6b50}
.fb.no{background:#32242a;color:#f0b3ae;border:1px solid #74464a}
.inline-input{display:flex;gap:8px;margin-top:10px}
.inline-input input{
  flex:1;background:#1a1d23;border:1px solid var(--line);border-radius:9px;color:var(--txt);
  padding:9px 12px;font-size:14.5px;font-family:"STIX Two Text",Georgia,serif;
}
.inline-input input:focus{outline:none;border-color:var(--acc-d)}
.inline-input button,.btn{
  background:var(--acc);border:none;color:#ffffff;font-weight:700;padding:9px 18px;border-radius:9px;font-size:14px;
}
.inline-input button:hover,.btn:hover{background:var(--acc2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.btn.ghost:hover{color:var(--txt);border-color:var(--acc-d);background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.continue-row{display:flex;justify-content:flex-end;margin-top:4px}

/* recap card */
.recap{background:linear-gradient(180deg,#20242c,#1b1e24);border:1px solid var(--acc-d);border-radius:var(--radius);padding:15px 18px;max-width:640px}
.recap h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--acc2);margin-bottom:8px}
.recap ul{list-style:none}
.recap li{padding:4px 0 4px 20px;position:relative;color:var(--txt)}
.recap li::before{content:"▸";position:absolute;left:2px;color:var(--acc)}

/* widget */
.widget{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;max-width:680px;
}
.widget h4{font-size:13.5px;margin-bottom:4px}
.widget .wsub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.wrow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
canvas{background:#16181d;border-radius:9px;touch-action:none;display:block}
.wcontrols{flex:1;min-width:210px;display:flex;flex-direction:column;gap:9px}
.wcontrols label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.wcontrols input[type=range]{width:100%;accent-color:var(--acc)}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wbtns button{background:#242830;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:5px 10px;font-size:12.5px}
.wbtns button.on{color:var(--acc2);border-color:var(--acc-d);background:#2a3140}
.readout{background:#1a1d23;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:"STIX Two Text",Georgia,serif;font-size:15px}
.readout small{font-family:inherit;color:var(--mut);font-size:11.5px}
.signchip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;margin-right:5px}
.pos{background:#223026;color:#8fd4a8}.neg{background:#34242a;color:#f0a8a0}

/* homework list */
.hwgrid{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;width:100%}
.hwcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 17px;text-align:left;color:var(--txt);width:100%}
.hwcard:hover{border-color:var(--acc-d)}
.hwcard .top{display:flex;align-items:center;gap:10px}
.hwbadge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:#2a3140;color:var(--acc2);white-space:nowrap}
.hwbadge.bonus{background:#223428;color:#8fd4a8}
.hwcard .state{margin-left:auto;font-size:12px;color:var(--faint)}
.hwcard .stmt{margin-top:7px;color:var(--mut);font-size:13.5px}
.hwcard.done{border-color:#3d6b50}
.hwcard.done .state{color:var(--good)}
.backbtn{background:none;border:none;color:var(--mut);font-size:13px;margin-bottom:6px;padding:4px 0}
.backbtn:hover{color:var(--acc2)}

/* quiz */
.quizbox{max-width:680px;margin:0 auto;width:100%}
.progress{height:5px;background:#252932;border-radius:4px;overflow:hidden;margin:10px 0 22px}
.progress i{display:block;height:100%;background:var(--acc);transition:.3s}
.qcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.qmeta{font-size:12px;color:var(--faint);margin-bottom:10px}
.opt{
 display:flex;gap:11px;align-items:flex-start;background:#22252c;border:1px solid var(--line);border-radius:10px;
 padding:12px 15px;margin-top:9px;cursor:pointer;width:100%;text-align:left;color:var(--txt);font-size:14.5px;
}
.opt:hover{border-color:var(--acc-d)}
.opt.sel{border-color:var(--acc);background:#2a3140}
.opt .key{font-weight:700;color:var(--acc2)}
.opt.cr{border-color:var(--good);background:#223026}
.opt.wr{border-color:var(--bad);background:#32242a}
.expl{background:#241e19;border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-top:11px;font-size:13.5px;color:var(--mut)}
.expl b{color:var(--txt)}

/* mastery */
.mgrid{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.mcard h3{font-size:14px;margin-bottom:12px}
.mbar-row{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:13px}
.mbar-row .lbl{width:170px;color:var(--mut)}
.mtrack{flex:1;height:10px;background:#242830;border-radius:6px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc-d),var(--acc2))}
.mbar-row .val{width:92px;text-align:right;font-size:12px;color:var(--faint)}
.attempt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #252932;font-size:13px;color:var(--mut)}
.attempt:last-child{border-bottom:none}
.scorebig{font-size:40px;font-weight:700;color:var(--acc2);line-height:1}

/* onboarding */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:470px;width:100%;padding:26px 28px}
.modal h2{font-size:19px;margin-bottom:4px}
.modal p{color:var(--mut);font-size:14px;margin-bottom:16px}
.pick{display:flex;flex-direction:column;gap:9px}
.pick button{text-align:left;background:#242830;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 15px;font-size:14px}
.pick button:hover{border-color:var(--acc-d);background:#2a3140}
.pick button small{display:block;color:var(--faint);margin-top:2px}
.hidden{display:none!important}
.notice{font-size:12.5px;color:var(--faint);text-align:center;margin:14px 0}
.kbdtag{font-size:10.5px;color:var(--faint)}
.sectstrip{display:none;gap:6px;overflow-x:auto;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.sectstrip button{flex-shrink:0;background:#242830;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.sectstrip button.on{color:var(--acc2);border-color:var(--acc-d);background:#2a3140}
.kbd-hint{font-size:11.5px;color:var(--faint)}
.rvcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;margin-bottom:12px}
.rvcard .src{font-size:11px;font-weight:700;color:var(--acc2);background:#2a3140;border-radius:10px;padding:2px 9px;display:inline-block}
@media (max-width:1150px){
  .brand small{display:none}
  .chip{display:none}
  nav button{padding:6px 11px}
  header{gap:10px}
}
@media (max-width:880px){
  .rail{display:none}
  .sectstrip{display:flex}
  header{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:6px}
  .brand small{display:none}
  nav{margin-left:0;overflow-x:auto;max-width:100%;width:100%}
  html,body{height:auto}
  main{height:auto;overflow:visible;flex-direction:column}
  .content{overflow:visible}
  .conv{overflow:visible;padding:14px 10px 8px}
}

/* ---------- Light-theme fixes for hard-coded dark surfaces ---------- */
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c9d0dc}
html[data-theme="light"] nav button:hover{background:#eceff4}
html[data-theme="light"] nav button.active{background:#e3e8f2}
html[data-theme="light"] .chip{background:#eceff4}
html[data-theme="light"] .secitem:hover{background:#ece2d0}
html[data-theme="light"] .secitem.active{background:#e3e8f2}
html[data-theme="light"] .secitem .dot{border-color:#b3bccb}
html[data-theme="light"] .mn{background:#e9edf5}
html[data-theme="light"] .formula{background:#f7f8fa}
html[data-theme="light"] .choices button{background:#e8ecf3}
html[data-theme="light"] .choices button:hover{background:#e3e8f2}
html[data-theme="light"] .choices button.correct{background:#e2f2e6;border-color:#1f8a4d}
html[data-theme="light"] .choices button.wrong{background:#f9e3e3;border-color:#d24545}
html[data-theme="light"] .fb.ok{background:#e2f2e6;color:#2e5c39;border-color:#a5cbae}
html[data-theme="light"] .fb.no{background:#f9e3e3;color:#8f2c1f;border-color:#d9a8a8}
html[data-theme="light"] .inline-input input{background:#f7f8fa}
html[data-theme="light"] .recap{background:linear-gradient(180deg,#f8f2e6,#eceef2)}
html[data-theme="light"] .wbtns button{background:#e8ecf3;color:#5a6270}
html[data-theme="light"] .wbtns button.on{background:#e3e8f2}
html[data-theme="light"] .readout{background:#f7f8fa}
html[data-theme="light"] .pos{background:#e2f2e6;color:#2e5c39}
html[data-theme="light"] .neg{background:#f9e3e3;color:#8f2c1f}
html[data-theme="light"] .hwbadge{background:#e3e8f2}
html[data-theme="light"] .hwbadge.bonus{background:#e2f2e6;color:#2e5c39}
html[data-theme="light"] .hwcard.done{border-color:#5da271}
html[data-theme="light"] .progress{background:#e4e7ed}
html[data-theme="light"] .opt{background:#f2f4f8}
html[data-theme="light"] .opt.sel{background:#e3e8f2}
html[data-theme="light"] .opt.cr{background:#e2f2e6;border-color:#1f8a4d}
html[data-theme="light"] .opt.wr{background:#f9e3e3;border-color:#d24545}
html[data-theme="light"] .expl{background:#eceef2}
html[data-theme="light"] .mtrack{background:#e6e9ee}
html[data-theme="light"] .attempt{border-bottom-color:#e4e7ed}
html[data-theme="light"] .pick button{background:#e8ecf3}
html[data-theme="light"] .pick button:hover{background:#e3e8f2}
html[data-theme="light"] .overlay{background:rgba(25,32,48,.4)}
html[data-theme="light"] .sectstrip button{background:#eceff4;border-color:#d4dae4;color:#5a6270}
html[data-theme="light"] .sectstrip button.on{background:#e3e8f2;color:#2456b8;border-color:#c6d2ea}
html[data-theme="light"] .rvcard .src{background:#e4e9f2}
/* Canvas widgets draw in light ink — keep the canvas backdrop dark in both themes */
canvas{background:#15171c;border-radius:12px}

/* ---------- Learn helper mechanics ---------- */
.skiprow{display:flex;justify-content:flex-end;margin-bottom:4px}
.ghostmini{background:transparent;border:1px solid var(--line);color:var(--mut);font-size:12px;border-radius:8px;padding:4px 10px;cursor:pointer}
.ghostmini:hover{color:var(--acc2);border-color:var(--acc-d)}
.ghostmini:disabled{opacity:.45;cursor:default}
.scaffold{border:1px dashed var(--acc-d);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.sch-head{font-size:13px;font-weight:700;color:var(--acc2);margin-bottom:6px}
.scaffold .choices{margin:6px 0}
</style>
</head>
<body>

<header>
  <div class="brand">MA119 · Functions <small>Mathematics for Health Sciences · Week 2</small></div>
  <nav id="nav">
    <button data-tab="learn" class="active">Learn</button>
    <button data-tab="hw">Homework Help</button>
    <button data-tab="quiz">Quiz</button>
    <button data-tab="review">Review</button>
    <button data-tab="mastery">Mastery</button>
  </nav>
  <div class="spacer"></div>
  <span class="chip" id="progressChip">§1.1 · step 1</span>
  <button class="iconbtn" id="themeBtn" title="Toggle light / dark theme 日夜切换">Light</button>
  <button class="iconbtn" id="resetBtn" title="Clear saved progress">Reset</button>
</header>

<main>
  <!-- ================= LEARN ================= -->
  <section class="content" id="tab-learn">
    <aside class="rail">
      <h4>This week's route</h4>
      <div id="secList"></div>
      <h4 style="margin-top:18px">Ground rules</h4>
      <p class="muted" style="font-size:12px;padding:0 8px;line-height:1.5">
        I guide — you think. One question at a time. Wrong tries are welcome; understanding matters more than speed.
      </p>
    </aside>
    <div class="sectstrip" id="sectStrip"></div>
    <div class="conv" id="conv"><div class="wrap" id="feed"></div></div>
  </section>

  <!-- ================= HOMEWORK ================= -->
  <section class="content hidden" id="tab-hw">
    <div class="conv"><div class="hwgrid" id="hwList" style="padding-top:8px"></div></div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section class="content hidden" id="tab-quiz">
    <div class="conv"><div class="quizbox" id="quizArea" style="padding-top:14px"></div></div>
  </section>

  <!-- ================= REVIEW ================= -->
  <section class="content hidden" id="tab-review">
    <div class="conv"><div class="quizbox" id="reviewArea" style="padding-top:14px"></div></div>
  </section>

  <!-- ================= MASTERY ================= -->
  <section class="content hidden" id="tab-mastery">
    <div class="conv"><div class="mgrid" id="masteryArea" style="padding-top:14px"></div></div>
  </section>
</main>

<!-- Onboarding -->
<div class="overlay" id="onboard">
  <div class="modal" id="onboardCard"></div>
</div>

<script>
/* ============================================================
   Persistent state
============================================================ */
const STORE='ma119_ch1_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE))||{}; }catch(e){ return {}; }
}
function saveStore(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
let S = Object.assign({
  onboarded:false, goal:'learn', level:'grade10', theme:'dark',
  sec:0, step:0, secDone:[false,false,false,false],
  hw:{}, // id: {tries, finished, firstTry}
  attempts:[], // {setId,date,ans,score,byTopic,n,timeSec,qt}
  learn:{},   // 's{sec}_{step}' -> 1 first-try ok | 0
  hwsec:{},   // '1.1' -> [firstTryOkCount, totalProblems]
  missed:[],  // {k,type,a,b}  type: 'quiz'|'learn'|'hw'
}, loadStore());

/* ============================================================
   Small helpers
============================================================ */
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const norm=v=>String(v).replace(/\s+/g,'').replace(/−/g,'-').replace(/[“”]/g,'"').toLowerCase();
const shuffle=(a)=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function addMissed(type,a,b){
  const k=type+':'+a+':'+b;
  if(!S.missed.some(m=>m.k===k)) S.missed.push({k,type,a,b});
}
function afterAttempt(step, node, ok, fbEl){
  const key='s'+S.sec+'_'+S.step;
  if(ok){
    const firstOk=!step._tries;
    S.learn[key]=firstOk?1:0;
    if(!firstOk) addMissed('learn',S.sec,S.step);
    saveStore();
    fbEl.className='fb show ok';
    fbEl.textContent = step.ok || 'Nice — that is exactly it.';
    node.querySelectorAll('button,input').forEach(b=>b.disabled=true);
    const row=el('div','continue-row');
    const c=el('button','btn','Continue →');
    c.onclick=()=>advanceLesson();
    row.appendChild(c); node.appendChild(row);
  }else{
    step._tries=(step._tries||0)+1;
    fbEl.className='fb show no';
    if(step._tries>=2 && step.reveal){
      S.learn[key]=0; addMissed('learn',S.sec,S.step); saveStore();
      fbEl.innerHTML = (step.fb||'Take another look. ')+'<br><br>'+step.reveal;
      node.querySelectorAll('button,input').forEach(b=>b.disabled=true);
      const row=el('div','continue-row');
      const c=el('button','btn','I get it — Continue →');
      c.onclick=()=>advanceLesson();
      row.appendChild(c); node.appendChild(row);
    }else{
      fbEl.textContent = step.fb || 'Not quite — give it another try. Talk it through in your head first.';
    }
  }
}
function startHelp(st,body,ch,fb,helper){
  if(st._helped)return;st._helped=true;
  S.learn['s'+S.sec+'_'+S.step]=0;addMissed('learn',S.sec,S.step);saveStore();
  if(st.scaffold){renderScaffold(st,body,ch,fb,helper);}
  else{finishHelp(st,body,ch,fb,helper);}
}
function finishHelp(st,body,ch,fb,helper){
  if(ch)[...ch.children].forEach(x=>x.disabled=true);
  const ip=body.querySelector('input');if(ip)ip.disabled=true;
  const ib=body.querySelector('.inline-input button');if(ib)ib.disabled=true;
  const sk=body.querySelector('.skiprow button');if(sk)sk.disabled=true;
  helper.innerHTML='';
  fb.className='fb show no';
  fb.innerHTML=st.reveal||st.ok||'See the section recap.';
  if(st.detail){
    const d=el('button','ghostmini','More detail ▸ 更多');
    const dx=el('div','expl');
    dx.style.display='none';dx.innerHTML=st.detail;
    d.onclick=()=>{dx.style.display=dx.style.display==='none'?'block':'none';};
    helper.append(d,dx);
  }
  const row=el('div','continue-row');const nx=el('button','btn','Continue →');
  nx.onclick=()=>advanceLesson();row.appendChild(nx);body.appendChild(row);convScroll();
}
function renderScaffold(st,body,ch,fb,helper){
  const sc=el('div','scaffold');
  const head=el('div','sch-head','Let\'s build it up in small steps 分步引导');
  sc.appendChild(head);
  let i=0;
  function step(){
    if(i>=st.scaffold.length){
      sc.innerHTML='';
      const done=el('div','sch-head','Now you\'ve seen every move — try the original again ↺');
      const back=el('button','btn','Back to the question ↺');
      back.onclick=()=>{sc.remove();fb.className='fb';fb.textContent='';
        if(ch)ch.querySelectorAll('button').forEach(x=>{if(!x.classList.contains('correct'))x.disabled=false;});
        const ip=body.querySelector('input');if(ip){ip.disabled=false;ip.focus();}};
      sc.append(done,back);convScroll();return;
    }
    const mini=st.scaffold[i];
    const mq=el('p','',`<b>${i+1}/${st.scaffold.length}.</b> ${mini.q}`);
    const mch=el('div','choices');const mfb=el('div','fb');
    let mt=0;
    mini.choices.forEach(mc=>{
      const mb=el('button','',mc.txt);
      mb.onclick=()=>{
        if(mc.ok){mch.querySelectorAll('button').forEach(x=>x.disabled=true);mb.classList.add('correct');
          mfb.className='fb show ok';mfb.textContent=mini.oktxt;
          const nx=el('button','ghostmini','Next ▸');nx.onclick=()=>{i++;step();};mfb.appendChild(document.createElement('br'));mfb.appendChild(nx);}
        else{mt++;mb.disabled=(mt>=2);mb.classList.add('wrong');
          mfb.className='fb show no';
          mfb.textContent=mt>=2?(mini.oktxt||''):(mini.fb||'Not quite.');
          if(mt>=2){const nx=el('button','ghostmini','Next ▸');nx.onclick=()=>{i++;step();};mfb.appendChild(document.createElement('br'));mfb.appendChild(nx);}}
      };
      mch.appendChild(mb);
    });
    const holder=el('div','');holder.append(mq,mch,mfb);
    sc.appendChild(holder);convScroll();
  }
  helper.innerHTML='';body.appendChild(sc);step();
}

WIDGETS.vlt={

    circle:  {name:'x² + y² = 1 (circle)',pts:(x)=>{const r=95,x2=x*x;return x2<=r*r?[Math.sqrt(r*r-x2),-Math.sqrt(r*r-x2)]:[];}},
    side:    {name:'x = y² (sideways)',pts:(x)=>x>=0?[Math.sqrt(150*x),-Math.sqrt(150*x)].filter(y=>Math.abs(y)<=130):[]},
    sine:    {name:'y = sin x',pts:(x)=>[60*Math.sin(x/32)]},
  },
  mount(host){
    host.innerHTML=`
      <h4>Vertical Line Test <span class="zh">垂直线检验</span></h4>
      <div class="wsub">Drag the orange vertical line across each curve. A curve is a function only if the line meets it <b>at most once</b>.</div>
      <div class="wrow">
        <canvas id="vltC" width="330" height="280"></canvas>
        <div class="wcontrols">
          <div class="wbtns" id="vltBtns"></div>
          <div class="readout" id="vltOut">—</div>
          <p class="muted" style="font-size:12.5px">One fixed x = one vertical line. Two crossings = two heights for the same input.</p>
        </div>
      </div>`;
    const cv=$('#vltC'),ctx=cv.getContext('2d');
    const W=330,H=280,cx=W/2,cy=H/2;
    let cur='parabola', vx=60, drag=false;
    const btns=$('#vltBtns'), out=$('#vltOut');
    Object.keys(this.curves).forEach(k=>{
      const b=el('button',k===cur?'on':'',this.curves[k].name);
      b.onclick=()=>{cur=k;[...btns.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');draw();};
      btns.appendChild(b);
    });
    const X=x=>cx+x, Y=y=>cy-y;
    function draw(){
      ctx.clearRect(0,0,W,H);
      // grid
      ctx.strokeStyle='#1e2127';ctx.lineWidth=1;
      for(let g=-150;g<=150;g+=30){ctx.beginPath();ctx.moveTo(X(g),0);ctx.lineTo(X(g),H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,Y(g));ctx.lineTo(W,Y(g));ctx.stroke();}

      ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
      // curve
      ctx.strokeStyle='#8fb0ff';ctx.lineWidth=2.3;ctx.beginPath();
      for(let px=0;px<=W;px++){
        const wx=px-cx, ys=WIDGETS.vlt.curves[cur].pts(wx);
        ys.forEach((yy,idx)=>{const py=Y(yy);idx===0&&ys.length===1?(px===0?ctx.moveTo(px,py):ctx.lineTo(px,py)):ctx.rect(px-1.2,py-1.2,2.4,2.4);});
      }
      ctx.stroke();
      // vertical line
      const hits=WIDGETS.vlt.curves[cur].pts(vx).length;
      ctx.strokeStyle='#5f8af7';ctx.setLineDash([6,5]);ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(X(vx),8);ctx.lineTo(X(vx),H-8);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#5f8af7';ctx.beginPath();ctx.arc(X(vx),14,5,0,7);ctx.fill();
      WIDGETS.vlt.curves[cur].pts(vx).forEach(yy=>{ctx.fillStyle='#67c587';ctx.beginPath();ctx.arc(X(vx),Y(yy),5,0,7);ctx.fill();});
      out.innerHTML = hits===0
        ? '0 crossings here (line misses the curve). Keep scanning…'
        : hits===1
          ? '<b style="color:#8fd4a8">1 crossing → PASS</b> — at this x, one output.'
          : `<b style="color:#f0a8a0">${hits} crossings → FAIL</b> — one x, two y-values: not a function of x.`;
    }
    draw();
    cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);move(e);});
    cv.addEventListener('pointermove',e=>{if(drag)move(e);});
    cv.addEventListener('pointerup',()=>drag=false);
    function move(e){const r=cv.getBoundingClientRect();vx=Math.max(-150,Math.min(150,e.clientX-r.left-cx));draw();}
  }

      ctx.stroke();
      // sampled: one point per ~6 px
      const samples=[];
      ctx.strokeStyle='#5f8af7';ctx.lineWidth=1.8;ctx.beginPath();
      for(let px=mL;px<=W-6;px+=6){const x=xmin+(px-mL)/(W-mL-6)*(xmax-xmin),y=Math.sin(100*x);samples.push([px,Y(y)]);}
      samples.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
      ctx.fillStyle='#8fb0ff';samples.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.2,0,7);ctx.fill();});
      ctx.fillStyle='#6f7683';ctx.font='11px sans-serif';
      ctx.fillText('window: ['+xmin+', '+xmax+']',mL,H-6);
    }
    draw();
  }
};

   detail:'<b>Formal definition (Thomas §1.1):</b> a function from a set D to a set R assigns to each element x in D <b>exactly one</b> element y in R. D = domain (legal inputs), range = outputs actually hit. One button → two possible drinks breaks the contract, which is why y² = x is not a function of x.'},

   <div class="formula">Domain 定义域 D = all allowed inputs &nbsp;·&nbsp; Range 值域 = outputs actually produced</div>

{title:'§1.2 Combining & Transforming', steps:[
  {t:'say', html:`<p>Functions can be added, subtracted, multiplied and divided — point by point, like numbers. The domain of any combination starts from the <b>intersection</b> <span class="zh">交集</span> D(f) ∩ D(g); both machines must accept the input.</p>
   <div class="formula">(f+g)(x)=f(x)+g(x) · (fg)(x)=f(x)g(x) · (f/g)(x)=f(x)/g(x), &nbsp;g(x)≠0</div>
   <p>For a quotient, also delete every x where g(x)=0.</p>`,
   detail:'Sums, products and quotients demand BOTH ingredient rules at once, so domains intersect. Quotients then subtract one more thing: every zero of the denominator — even if the numerator also vanishes there (0/0 is still banned). Bracket vs paren follows each piece\'s ≤/≥ or </> rule.'},

  {t:'say', html:`<p>Now the geometry that makes sketching fast. From a known graph y = f(x):</p>

{title:'§1.3 Trigonometric Functions', steps:[
  {t:'say', html:`<p>Trig time — but in the units calculus actually uses: <b>radians</b> <span class="zh">弧度</span>.</p>
   <div class="formula">θ = s / r &nbsp;·&nbsp; on the unit circle θ equals the arc length &nbsp;·&nbsp; π rad = 180°</div>
   <p>Degree → radian: × π/180. Radian → degree: × 180/π.</p>`,
   detail:'One radian is the angle subtending an arc equal in length to the radius: s = rθ. A full turn is 2π rad because the circumference is 2πr. Radians are dimensionless (length/length) — and calculus identities like d/dx sin x = cos x hold ONLY in radians.'},

  {t:'widget', id:'circle',
   html:`<p>This is the master key: on the unit circle, the point P has coordinates <b>(cos θ, sin θ)</b>. Drag it around; use the snap buttons for special angles. Watch the signs flip by quadrant — that is the <b>CAST</b> rule.</p>`},
  {t:'say', html:`<p>All six functions come from one point P(x, y) on a circle of radius r:</p>
   <div class="formula">sin θ = y/r · cos θ = x/r · tan θ = y/x &nbsp;&nbsp; csc, sec, cot are their reciprocals</div>
   <p>tan and sec die where cos θ = 0 (θ = π/2 + kπ); cot and csc die where sin θ = 0. Memory trick: each function breaks where its denominator sibling breaks.</p>`},
  {t:'ask', q:'Let us evaluate sin(7π/6). Step 1 — which quadrant?',
   choices:[{txt:'Quadrant III',ok:true},{txt:'Quadrant II',ok:false},{txt:'Quadrant IV',ok:false}],
   ok:'QIII — one step past the negative x-axis.'},
  {t:'ask', q:'Step 2 — CAST in QIII: which sign does sine have there?',
   choices:[{txt:'Negative',ok:true},{txt:'Positive',ok:false}],
   ok:'Negative — in QIII only tan (and cot) are positive. Sine and cosine are both negative.'},
  {t:'ask', q:'Step 3 — the reference angle to the x-axis is π/6, so the SIZE comes from sin(π/6). What is sin(7π/6)?',
   choices:[{txt:'−1/2',ok:true},{txt:'−√3/2',ok:false},{txt:'1/2',ok:false}],
   ok:'−1/2. Size from the reference angle, sign from CAST — two separate decisions. cos(7π/6) = −√3/2 and tan = 1/√3.'},
  {t:'say', html:`<div class="mn"><b>Special values without memorizing the table:</b> two triangles — 45-45-90 with sides 1:1:√2, and 30-60-90 with 1:√3:2. Sine row reads 0, 1/2, √2/2, √3/2, 1; cosine runs it backwards.</div>
   <p>And the identity from which everything grows — Pythagoras on the unit circle <span class="zh">恒等式之母</span>:</p>
   <div class="formula">cos²θ + sin²θ = 1 &nbsp;·&nbsp; 1 + tan²θ = sec²θ</div>`},
  {t:'ask', q:'sin θ = 3/5 with θ in Quadrant II. The identity gives cos²θ = 1 − 9/25 = 16/25. Pick the sign with CAST — cos θ = ?',
   choices:[{txt:'−4/5',ok:true},{txt:'4/5',ok:false},{txt:'±4/5',ok:false}],
   ok:'−4/5: identity gives the size, quadrant gives the sign. Cosine is negative in QII.',

   <p>When C = 90°, cos C = 0 and Pythagoras reappears as the special case.</p>`},

  {t:'recap', title:'§1.3 Takeaways', mn:'Size from the reference angle; sign from CAST. On the unit circle, coordinates ARE (cos, sin).',
   items:['Radians: θ = s/r; π = 180°; check calculator RAD mode',
          'CAST signs: QI all+, QII sin+, QIII tan+, QIV cos+',
          'Periods: sin/cos/sec/csc = 2π; tan/cot = π',

]},

/* ---------------- §1.4 ---------------- */
{title:'§1.4 Graphing with Software', steps:[
  {t:'say', html:`<p>Software plots fast — but it can lie. Three traps to supervise like a careful doctor reading a chart:</p>
   <p><b>1. Clipping.</b> The default viewing window <span class="zh">视窗</span> may cut off key features. Zoom and pan until nothing new appears.</p>
   <p><b>2. Distortion.</b> Only a <b>square window</b> (equal unit scales) shows true angles and circles — otherwise a circle looks squashed.</p>`},
  {t:'widget', id:'alias',
   html:`<p><b>3. Aliasing</b> <span class="zh">混叠</span>. Try the windows below — watch the sampled dots invent a fake wave when the true oscillation is too fast.</p>`},

const feed=$('#feed'), conv=$('#conv');
function renderRail(){
  const list=$('#secList');list.innerHTML='';

function renderLesson(){
  feed.innerHTML='';
  const L=LESSONS[S.sec];
  for(let i=0;i<=S.step;i++) addStepNode(L.steps[i],i===S.step);
  $('#progressChip').textContent=`${L.title.split(' ')[0]} · step ${S.step+1}/${L.steps.length}`;
  setTimeout(()=>conv.scrollTop=conv.scrollHeight,30);

function addStepNode(st,interactive){
  if(st.t==='say'){
    const node=teacherCard(st.html||`<p>${st.en||''}</p>`);
    if(st.detail){
      const body=node.querySelector('.bubble');
      const d=el('button','ghostmini','More detail ▸ 更多');
      const dx=el('div','expl');
      dx.style.display='none';dx.innerHTML=st.detail;
      d.onclick=()=>{dx.style.display=dx.style.display==='none'?'block':'none';};
      body.append(d,dx);
    }
    feed.appendChild(node);
    if(interactive){
      const row=el('div','continue-row');
      const b=el('button','btn','Continue →');
      b.onclick=()=>advanceLesson();
      const sk=el('button','ghostmini','Skip ▸');
      sk.title='Skip to next 略过';sk.onclick=()=>advanceLesson();
      row.append(b,sk);feed.appendChild(row);
    }
  }else if(st.t==='widget'){
    if(st.html) feed.appendChild(teacherCard(st.html));
    const w=el('div','widget');feed.appendChild(w);
    requestAnimationFrame(()=>WIDGETS[st.id].mount(w));
    if(interactive){
      const row=el('div','continue-row');
      const b=el('button','btn','I tried it — Continue →');
      b.onclick=()=>advanceLesson();
      row.appendChild(b);feed.appendChild(row);
    }
  }else if(st.t==='recap'){
    const c=el('div','recap');
    c.innerHTML=`<h3>${st.title} · Summary</h3>`;
    const u=el('ul');st.items.forEach(it=>u.appendChild(el('li','',it)));c.appendChild(u);
    if(st.mn)c.appendChild(el('div','mn',`<b>Memory hook 记忆口诀:</b> ${st.mn}`));
    feed.appendChild(c);
    if(interactive){
      const row=el('div','continue-row');
      const last=S.sec===LESSONS.length-1;
      const b=el('button','btn', last?'Finish section 🎉':'Continue to next section →');
      b.onclick=()=>{
        S.secDone[S.sec]=true;
        if(!last){S.sec++;S.step=0;}
        saveStore();renderAll();
        if(last){setTab('hw');}
      };
      row.appendChild(b);feed.appendChild(row);
    }
  }else if(st.t==='ask'){
    const node=teacherCard('');const body=node.querySelector('.bubble');body.classList.add('askcard');
    st._helped=false;
    body.innerHTML+=`<p>${st.q}</p>`;
    const skipRow=el('div','skiprow');
    const sk=el('button','ghostmini','Skip ▸');
    sk.title='Skip this question 跳过此题';
    sk.onclick=()=>{S.learn['s'+S.sec+'_'+S.step]=0;addMissed('learn',S.sec,S.step);saveStore();advanceLesson();};
    skipRow.appendChild(sk);body.appendChild(skipRow);
    const fb=el('div','fb');const ch=el('div','choices');
    const helper=el('div','');
    body.append(ch,fb,helper);
    st.choices.forEach(c=>{
      const b=el('button','',c.txt);
      b.onclick=()=>{
        if(c.ok){
          const firstOk=!st._tries;
          S.learn['s'+S.sec+'_'+S.step]=firstOk?1:0;
          if(!firstOk)addMissed('learn',S.sec,S.step);
          saveStore();
          [...ch.children].forEach(x=>x.disabled=true);b.classList.add('correct');
          sk.disabled=true;helper.innerHTML='';
          fb.className='fb show ok';fb.textContent=st.ok||'Correct.';
          const row=el('div','continue-row');const nx=el('button','btn','Continue →');
          nx.onclick=()=>advanceLesson();row.appendChild(nx);body.appendChild(row);convScroll();
        }else{
          st._tries=(st._tries||0)+1;b.disabled=true;b.classList.add('wrong');
          fb.className='fb show no';
          if(st._tries===1){
            fb.textContent=st.fb||'Not quite — try once more.';
            helper.innerHTML='';
            const stuck=el('button','ghostmini','I\'m stuck — teach me 让我学');
            stuck.onclick=()=>startHelp(st,body,ch,fb,helper);
            helper.appendChild(stuck);
          }else{
            fb.textContent=st.h2||st.fb||'Let me help.';
            helper.innerHTML='';
            const retry=el('button','ghostmini','Try again ↺');
            const show=el('button','ghostmini','Show explanation ▸');
            retry.onclick=()=>{fb.className='fb';fb.textContent='';helper.innerHTML='';ch.querySelectorAll('button').forEach(x=>{if(!x.classList.contains('correct'))x.disabled=false;});};
            show.onclick=()=>finishHelp(st,body,ch,fb,helper);
            helper.append(retry,show);
          }
        }
        convScroll();
      };
      ch.appendChild(b);
    });
    feed.appendChild(node);
  }else if(st.t==='input'){
    const node=teacherCard('');
    const body=node.querySelector('.bubble');body.classList.add('askcard');
    st._helped=false;
    body.innerHTML+=`<p>${st.q}</p>`;
    const skipRow=el('div','skiprow');
    const sk=el('button','ghostmini','Skip ▸');
    sk.title='Skip this question 跳过此题';
    sk.onclick=()=>{S.learn['s'+S.sec+'_'+S.step]=0;addMissed('learn',S.sec,S.step);saveStore();advanceLesson();};
    skipRow.appendChild(sk);body.appendChild(skipRow);
    const fb=el('div','fb');const helper=el('div','');
    const form=el('div','inline-input');
    const inp=el('input');inp.placeholder=st.placeholder||'Type your answer';
    const btn=el('button','','Check');
    form.append(inp,btn);body.append(form,fb,helper);
    const succeed=()=>{
      const firstOk=!st._tries;
      S.learn['s'+S.sec+'_'+S.step]=firstOk?1:0;
      if(!firstOk)addMissed('learn',S.sec,S.step);
      saveStore();
      inp.disabled=true;btn.disabled=true;sk.disabled=true;helper.innerHTML='';
      fb.className='fb show ok';fb.textContent=st.ok||'Correct.';
      const row=el('div','continue-row');const nx=el('button','btn','Continue →');
      nx.onclick=()=>advanceLesson();row.appendChild(nx);body.appendChild(row);convScroll();
    };
    const fail=()=>{
      st._tries=(st._tries||0)+1;
      fb.className='fb show no';
      if(st._tries===1){
        fb.textContent=st.fb||'Not quite — try once more.';
        helper.innerHTML='';
        const stuck=el('button','ghostmini','I\'m stuck — teach me 让我学');
        stuck.onclick=()=>startHelp(st,body,null,fb,helper);
        helper.appendChild(stuck);
      }else{
        fb.textContent=st.h2||st.fb||'Let me help.';
        helper.innerHTML='';
        const retry=el('button','ghostmini','Try again ↺');
        const show=el('button','ghostmini','Show explanation ▸');
        retry.onclick=()=>{fb.className='fb';fb.textContent='';helper.innerHTML='';inp.disabled=false;btn.disabled=false;inp.focus();};
        show.onclick=()=>finishHelp(st,body,null,fb,helper);
        helper.append(retry,show);
      }
      convScroll();
    };
    const submit=()=>{
      if(!inp.value.trim())return;
      if(st.accept(inp.value))succeed();else fail();
    };
    btn.onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    feed.appendChild(node);
    setTimeout(()=>inp.focus(),50);
  }
}

  return m;

  const intro=el('div','',`<h2 style="font-size:18px;margin-bottom:4px">Chapter 1 Homework <span style="color:var(--faint);font-size:13px;font-weight:400">— 10 problems · I will guide, not solve for you</span></h2>

  wrap.appendChild(intro);

function renderHWSession(h){
  const wrap=$('#hwList');wrap.innerHTML='';
  const back=el('button','backbtn','← All homework problems');back.onclick=renderHWList;wrap.appendChild(back);
  const card=el('div','qcard','');card.innerHTML=`<div class="qmeta">${h.badge}</div><div style="font-size:15.5px">${h.stmt}</div>`;
  wrap.appendChild(card);
  const stat=el('div','qmeta','');wrap.appendChild(stat);
  const box=el('div','');wrap.appendChild(box);
  let idx=0, allFirst=true; const wrongSteps=[];
  function showStep(){
    const st=h.steps[idx];
    stat.textContent=`Guided step ${idx+1} / ${h.steps.length}`;
    let firstTry=true;
    if(!st){finishHW();return;}
    if(st.t==='say'){
      box.appendChild(teacherCard(st.html));nextBtn('Continue');
    }else if(st.t==='ask'){
      const node=teacherCard('');const body=node.querySelector('.bubble');body.classList.add('askcard');
      body.innerHTML+=`<p>${st.q}</p>`;
      const fb=el('div','fb');const ch=el('div','choices');
      st.choices.forEach(c=>{
        const b=el('button','',c.txt);
        b.onclick=()=>{[...ch.children].forEach(x=>x.disabled=true);b.classList.add(c.ok?'correct':'wrong');
          if(c.ok){if(!firstTry){allFirst=false;wrongSteps.push(idx);}fb.className='fb show ok';fb.textContent=st.ok||'Correct.';[...ch.children].forEach(x=>x.disabled=true);
            setTimeout(nextBtn('Next →'),250);}
          else{firstTry=false;fb.className='fb show no';fb.textContent=st.fb||'Think again — try another choice.';}};
        ch.appendChild(b);});
      body.append(ch,fb);box.appendChild(node);
    }else if(st.t==='input'){
      const node=teacherCard('');const body=node.querySelector('.bubble');body.classList.add('askcard');
      body.innerHTML+=`<p>${st.q}</p>`;
      const fb=el('div','fb');const form=el('div','inline-input');
      const inp=el('input');inp.placeholder=st.placeholder||'';const btn=el('button','','Check');
      form.append(inp,btn);body.append(form,fb);box.appendChild(node);inp.focus();
      let tries=0;
      btn.onclick=()=>{if(!inp.value.trim())return;tries++;
        if(st.accept(inp.value)){inp.disabled=btn.disabled=true;if(!firstTry){allFirst=false;wrongSteps.push(idx);}fb.className='fb show ok';
          fb.innerHTML=st.ok||'Correct — nicely done.';setTimeout(()=>nextBtn('Next →'),250);}
        else if(tries>=2&&st.reveal){inp.disabled=btn.disabled=true;if(firstTry){firstTry=false;allFirst=false;wrongSteps.push(idx);}fb.className='fb show no';
          fb.innerHTML=st.reveal;setTimeout(()=>nextBtn('Next →'),400);}
        else{firstTry=false;fb.className='fb show no';fb.innerHTML=st.fb||'Not quite — one more try.';}};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
    }
    convScroll();
  }
  function nextBtn(label){
      const row=el('div','continue-row');const b=el('button','btn',label);
      b.onclick=()=>{idx++;showStep();};row.appendChild(b);box.appendChild(row);convScroll();
  }
  function finishHW(){
    const m=h.badge.match(/§(\d\.\d)/);const sec=m?m[1]:'1.4';
    S.hwsec[sec]=S.hwsec[sec]||[0,0];S.hwsec[sec][0]+=allFirst?1:0;S.hwsec[sec][1]+=1;
    wrongSteps.forEach(si=>addMissed('hw',h.id,si));
    S.hw[h.id]={finished:true,tries:(S.hw[h.id]?.tries||0)+1,firstTry:allFirst};saveStore();
    const c=el('div','recap');
    c.innerHTML=`<h3>Nice work ✦</h3><p>You reasoned through ${h.badge.split('·')[0].trim()} yourself. In your written submission, show each of these small steps — that is what earns full credit.</p>`;
    const row=el('div','continue-row');const b=el('button','btn','Back to homework list');b.onclick=renderHWList;row.appendChild(b);
    box.append(c,row);convScroll();
  }
  showStep();
}

}
function renderQ(){
  const a=$('#quizArea');a.innerHTML='';
  qz.qt[qz.qi]+=Date.now()-qz.q0;qz.q0=Date.now();
  const {set,qi}=qz;
  const bar=el('div','progress');bar.innerHTML=`<i style="width:${(qi/set.qs.length)*100}%"></i>`;a.appendChild(bar);
  const card=el('div','qcard');
  card.innerHTML=`<div class="qmeta">${set.name} · Question ${qi+1} of ${set.qs.length} · fixed order · <span class="kbd-hint">keys A–D select · Enter next</span></div><div style="font-size:15.5px;margin-bottom:6px">${set.qs[qi].q}</div>`;
  set.qs[qi].o.forEach((t,i)=>{
    const o=el('div','opt'+(qz.ans[qi]===i?' sel':''));
    o.innerHTML=`<span class="key">${'ABCD'[i]}</span><span>${t}</span>`;
    o.onclick=()=>{qz.ans[qi]=i;renderQ();};
    card.appendChild(o);
  });
  const row=el('div','continue-row');row.style.justifyContent='space-between';row.style.marginTop='16px';
  const prev=el('button','btn ghost','← Prev');prev.disabled=qi===0;
  prev.onclick=()=>{qz.qi--;renderQ();};
  const back=el('button','btn ghost','Exit');back.onclick=()=>{if(confirm('Exit the quiz? Your answers this round will not be saved.'))renderQuizHome();};
  const next=el('button','btn',qi===set.qs.length-1?'Submit ▸':'Next →');
  next.disabled=qz.ans[qi]===null;
  next.onclick=()=>{ if(qi<set.qs.length-1){qz.qi++;renderQ();} else submitQuiz(); };
  row.append(prev,back,next);card.appendChild(row);
  a.appendChild(card);
}
function submitQuiz(){
  const {set,ans}=qz;
  qz.qt[qz.qi]+=Date.now()-qz.q0;
  const timeSec=Math.round((Date.now()-qz.t0)/1000);
  const qt=qz.qt.map(x=>Math.round(x/1000));
  let score=0;const byTopic={};
  set.qs.forEach((q,i)=>{
    const tp=set.topic[i];byTopic[tp]=byTopic[tp]||[0,0];byTopic[tp][1]++;
    if(ans[i]===q.a){score++;byTopic[tp][0]++;}
  });
  S.attempts.push({setId:set.id,date:new Date().toISOString(),ans:ans.slice(),score,byTopic,n:set.qs.length,timeSec,qt});
  if(set.src){
    set.src.forEach((m,i)=>{ if(ans[i]===set.qs[i].a) S.missed=S.missed.filter(x=>x.k!==('quiz:'+m.setId+':'+m.qi)); });
  }else{
    set.qs.forEach((q,i)=>{ if(ans[i]!==q.a) addMissed('quiz',set.id,i); });
  }
  saveStore();qz=null;
  // review
  const a=$('#quizArea');a.innerHTML='';
  a.appendChild(el('div','',`<h2 style="font-size:18px">Result: ${score} / ${set.qs.length}</h2>
    <p class="muted" style="font-size:13.5px;margin:6px 0 14px">${score===set.qs.length?'Flawless — teach this to a classmate tonight to lock it in.':'We review every question below. Misses are where the learning happens.'}</p>`));
  set.qs.forEach((q,i)=>{
    const ok=ans[i]===q.a;
    const card=el('div','qcard','');card.style.marginBottom='12px';card.style.padding='16px 20px';
    card.innerHTML=`<div class="qmeta" style="color:${ok?'var(--good)':'var(--bad)'}">Q${i+1} · ${ok?'Correct':'Missed'} · ${TOPICS[set.topic[i]]}</div>
      <div style="margin:4px 0 8px">${q.q}</div>`;
    q.o.forEach((t,j)=>{
      const cls='opt '+ (j===q.a?'cr':(j===ans[i]?'wr':''));
      const d=el('div',cls);d.style.cursor='default';d.style.marginTop='6px';
      d.innerHTML=`<span class="key">${'ABCD'[j]}</span><span>${t}${j===q.a?' ✔':''}${j===ans[i]&&j!==q.a?' ✘':''}</span>`;
      card.appendChild(d);
    });
    card.appendChild(el('div','expl',`<b>Why:</b> ${q.ex}`));
    a.appendChild(card);
  });
  const row=el('div','continue-row');row.style.justifyContent='space-between';row.style.maxWidth='680px';
  const again=el('button','btn ghost','Retake another set');again.onclick=renderQuizHome;
  const mast=el('button','btn','See my mastery map →');mast.onclick=()=>setTab('mastery');
  row.append(again,mast);a.appendChild(row);
}

/* ============================================================
   Render: Mastery
============================================================ */
function renderMastery(){
  const a=$('#masteryArea');a.innerHTML='';
  const card=el('div','mcard');
  card.innerHTML='<h3>Mastery by topic <span style="color:var(--faint);font-weight:400;font-size:12px">— from all quiz attempts, most recent weighted higher</span></h3>';
  const topicAgg={};
  const att=S.attempts;
  att.forEach((at,i)=>{
    const w=0.5+0.5*((i+1)/Math.max(att.length,1));
    Object.entries(at.byTopic).forEach(([tp,[c,t]])=>{
      topicAgg[tp]=topicAgg[tp]||[0,0];topicAgg[tp][0]+=c*w;topicAgg[tp][1]+=t*w;
    });
  });
  if(!att.length){
    card.innerHTML+='<p class="muted" style="font-size:13.5px">No quiz data yet. Finish a quiz set and your topic strengths will appear here.</p>';
  }else{
    Object.keys(TOPICS).forEach(tp=>{
      const r=topicAgg[tp];if(!r)return;
      const pct=Math.round(r[0]/r[1]*100);
      const color=pct>=80?'var(--good)':pct>=55?'var(--acc2)':'var(--bad)';
      const row=el('div','mbar-row');
      row.innerHTML=`<span class="lbl">${TOPICS[tp]}</span><span class="mtrack"><i style="width:${pct}%;background:${color}"></i></span><span class="val">${pct}%</span>`;
      card.appendChild(row);
    });
  }
  a.appendChild(card);

  const prac=el('div','mcard');
  prac.innerHTML='<h3>Guided practice accuracy <span style="color:var(--faint);font-weight:400;font-size:12px">— Learn & Homework, first-try results</span></h3>';
  let anyPrac=false;
  [['1.1',0],['1.2',1],['1.3',2],['1.4',3]].forEach(([sec,li])=>{
    let ok=0,tot=0;
    LESSONS[li].steps.forEach((st,si)=>{
      const r=S.learn['s'+li+'_'+si];
      if((st.t==='ask'||st.t==='input')&&r!==undefined){tot++;ok+=r;}
    });
    const hw=S.hwsec[sec];
    if(hw){ok+=hw[0];tot+=hw[1];}
    if(tot)anyPrac=true;
    const pct=tot?Math.round(ok/tot*100):null;
    const row=el('div','mbar-row');
    row.innerHTML=`<span class="lbl">§${sec} guided</span><span class="mtrack"><i style="width:${pct==null?0:pct}%;background:${pct==null?'#2c3038':pct>=80?'var(--good)':pct>=55?'var(--acc2)':'var(--bad)'}"></i></span><span class="val">${pct==null?'— not yet':pct+'% · '+tot+' tries'}</span>`;
    prac.appendChild(row);
  });
  if(!anyPrac)prac.innerHTML+='<p class="muted" style="font-size:13.5px">Answer Learn or Homework questions and your first-try accuracy shows up here.</p>';
  a.appendChild(prac);

  const note=el('div','mcard');
  if(att.length>=5){
    const last5=att.slice(-5);
    const weak=Object.entries(topicAgg).sort((x,y)=>(x[1][0]/x[1][1])-(y[1][0]/y[1][1])).slice(0,2).map(x=>TOPICS[x[0]]);
    const avgPct=Math.round(last5.reduce((s,x)=>{const n=x.n||8;return s+x.score/n;},0)/last5.length*100);
    const qts=att.filter(x=>x.qt&&x.qt.length).flatMap(x=>x.qt);
    const avgT=qts.length?Math.round(qts.reduce((s,x)=>s+x,0)/qts.length):null;
    note.innerHTML=`<h3>After 5 sets: your check-in</h3>
      <p style="font-size:13.5px;color:var(--mut)">Recent average: about <b style="color:var(--acc2);font-size:16px">${avgPct}%</b>${avgT!=null?` · roughly <b style="color:var(--txt)">${avgT}s per question</b>`:''}. Focus your next review on: <b style="color:var(--txt)">${weak.join(' · ')}</b>. Revisit those sections in Learn, clear your Review notebook, then retake a set — the map updates immediately.</p>`;
  }else{
    note.innerHTML=`<h3>Your attempt history</h3><p class="muted" style="font-size:13.5px">Complete ${5-att.length} more quiz set${5-att.length>1?'s':''} to unlock your five-set mastery analysis — like a mini diagnosis before the real test.</p>`;
  }
  if(att.length){
    const list=el('div','');
    att.slice().reverse().slice(0,8).forEach(x=>{
      const n=x.n||8;
      const d=new Date(x.date);
      const nm=(QUIZ.find(q=>q.id===x.setId)||{}).name||'Review Drill';
      list.appendChild(el('div','attempt',`<span>${nm}</span><span>${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><span style="margin-left:auto;color:${x.score/n>=.8?'var(--good)':'var(--acc2)'}">${x.score}/${n}${x.timeSec!=null?' · '+x.timeSec+'s':''}</span>`));
    });
    note.appendChild(list);
  }
  a.appendChild(note);
}

/* ============================================================
   Render: Review (错题本)
============================================================ */
function renderReview(){
  const a=$('#reviewArea');a.innerHTML='';
  a.appendChild(el('div','',`<h2 style="font-size:18px;margin-bottom:4px">Review · 错题本</h2>
    <p class="muted" style="font-size:13.5px;margin-bottom:12px">Every question you missed on the first try lands here automatically. Clear it before the real test.</p>`));
  const items=S.missed;
  if(!items.length){
    a.appendChild(el('div','mcard','<p style="font-size:14px">Empty — nothing missed yet. Keep it that way, or let it fill up and become your personal mock exam.</p>'));
    return;
  }
  const qItems=items.filter(m=>m.type==='quiz');
  if(qItems.length){
    const drill=el('button','btn','Re-drill '+qItems.length+' quiz miss'+(qItems.length>1?'es':'')+' →');
    drill.style.marginBottom='14px';
    drill.onclick=()=>{const set=buildReviewSet();if(set)startQuiz(set);};
    a.appendChild(drill);
  }
  items.forEach(m=>{
    const card=el('div','rvcard');
    if(m.type==='quiz'){
      const s=QUIZ.find(x=>x.id===m.a);if(!s)return;const q=s.qs[m.b];if(!q)return;
      card.innerHTML=`<span class="src">Quiz · ${s.name} · Q${m.b+1} · ${TOPICS[s.topic[m.b]]}</span>
        <div style="margin:6px 0">${q.q}</div>`;
      q.o.forEach((t,j)=>{const d=el('div','opt'+(j===q.a?' cr':''));d.style.cursor='default';
        d.innerHTML=`<span class="key">${'ABCD'[j]}</span><span>${t}${j===q.a?' ✔':''}</span>`;card.appendChild(d);});
      card.appendChild(el('div','expl','<b>Why:</b> '+q.ex));
    }else if(m.type==='learn'){
      const L=LESSONS[m.a];const st=L&&L.steps[m.b];if(!st)return;
      card.innerHTML=`<span class="src">Learn · ${L.title}</span><div style="margin:6px 0">${st.q||''}</div>`;
      if(st.reveal)card.appendChild(el('div','expl',st.reveal));
      const row=el('div','continue-row');
      const redo=el('button','btn ghost','Redo this step');
      redo.onclick=()=>{setTab('learn');S.sec=m.a;S.step=m.b;saveStore();renderAll();};
      row.appendChild(redo);card.appendChild(row);
    }else if(m.type==='hw'){
      const h=HW.find(x=>x.id===m.a);const st=h&&h.steps[m.b];if(!st)return;
      card.innerHTML=`<span class="src">Homework · ${h.badge}</span><div style="margin:6px 0">${st.q||h.stmt}</div>`;
      if(st.reveal)card.appendChild(el('div','expl',st.reveal));
    }
    const row2=el('div','continue-row');
    const mk=el('button','btn ghost','Mark mastered ✓');
    mk.onclick=()=>{S.missed=S.missed.filter(x=>x.k!==m.k);saveStore();renderReview();};
    row2.appendChild(mk);card.appendChild(row2);
    a.appendChild(card);
  });
}

/* ============================================================
   Keyboard answering
============================================================ */
document.addEventListener('keydown',e=>{
  if(!S.onboarded)return;
  const t=document.activeElement&&document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='BUTTON')return;
  const activeBtn=document.querySelector('#nav button.active');
  if(!activeBtn)return;
  const tab=activeBtn.dataset.tab;
  if(e.key==='Enter'){
    const conts=document.querySelectorAll('#tab-'+tab+' .continue-row button:not([disabled])');
    if(conts.length){conts[conts.length-1].click();e.preventDefault();}
    return;
  }
  let idx='abcd'.indexOf(e.key.toLowerCase());
  if(idx<0)idx='1234'.indexOf(e.key);
  if(idx<0)return;
  if(tab==='quiz'){
    if(!qz)return;
    const opts=document.querySelectorAll('#quizArea .opt');
    if(opts[idx])opts[idx].click();
  }else{
    const btns=[...document.querySelectorAll('#tab-'+tab+' .choices button')].filter(b=>!b.disabled);
    if(btns[idx])btns[idx].click();
  }
});

/* ============================================================
   Tabs, onboarding, init
============================================================ */
function setTab(name){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  ['learn','hw','quiz','review','mastery'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==name));
  if(name==='hw')renderHWList();
  if(name==='quiz')renderQuizHome();
  if(name==='mastery')renderMastery();
  if(name==='review')renderReview();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#resetBtn').onclick=()=>{if(confirm('Clear all saved progress, quiz history and settings?')){localStorage.removeItem(STORE);location.reload();}};

const tb=$('#themeBtn');
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  tb.textContent=S.theme==='dark'?'Light':'Dark';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=S.theme==='dark'?'#14161b':'#f4f5f7';
}
tb.onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';saveStore();applyTheme();};
applyTheme();

const ONBOARD=[
  {title:'Welcome to MA119 👋',
   p:"I'm Ms. Lin, your guide for Chapter 1 — Functions. I'll ask one small question at a time and let you do the thinking. Before we start, two quick questions so I can match your pace.",
   picks:null},
  {key:'goal',title:'What brings you here today?',
   p:'You can switch modes any time from the toolbar.',
   picks:[
     {v:'learn',t:'Learn from scratch',s:'Step through §1.1–1.4 with guidance'},
     {v:'review',t:'Quick review',s:'I have seen this before'},
     {v:'hw',t:'Homework help',s:'Guide me through the 10 problems'},
     {v:'quiz',t:'Practice quiz',s:'Exam-style sets with analysis'}]},
  {key:'level',title:'How is your math background?',
   p:'This adjusts how much background linking I do. You can change it anytime by resetting.',
   picks:[
     {v:'grade10',t:'Grade 10 / high-school basics (recommended)',s:'We will build from what you know'},
     {v:'precalc',t:'I have done some precalculus',s:'Move a bit faster'},
     {v:'rusty',t:'A bit rusty — go slowly',s:'More links and reminders'}]},
  {title:'All set.',
   p:'One promise: when you bring me homework, I will not just hand over answers — I will guide you to find them yourself. Wrong guesses are part of the process. Ready?',
   picks:[{v:'go',t:'Start with §1.1 Functions →'}]}
];
let obIdx=0;
function renderOnboard(){
  const card=$('#onboardCard');const o=ONBOARD[obIdx];
  card.innerHTML=`<h2>${o.title}</h2><p>${o.p}</p>`;
  if(o.picks===null){const b=el('button','btn','Let’s begin');b.onclick=()=>{obIdx++;renderOnboard();};card.appendChild(b);}
  else{
    const pk=el('div','pick');
    o.picks.forEach(x=>{
      const b=el('button','',`${x.t}${x.s?`<small>${x.s}</small>`:''}`);
      b.onclick=()=>{
        if(o.key==='goal'){S.goal=x.v;}
        else if(o.key==='level'){S.level=x.v;}
        else if(x.v==='go'){
          S.onboarded=true;saveStore();$('#onboard').classList.add('hidden');
          if(S.goal==='hw')setTab('hw');else if(S.goal==='quiz')setTab('quiz');
          renderAll();return;
        }
        obIdx++;renderOnboard();
      };
      pk.appendChild(b);
    });
    card.appendChild(pk);
  }
}
function renderAll(){renderRail();renderLesson();}

if(S.onboarded){$('#onboard').classList.add('hidden');renderAll();}
else{renderOnboard();}
